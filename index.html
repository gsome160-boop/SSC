<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC</title>
    
    <!-- كود Google AdSense التلقائي الأساسي -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4545737968537975" crossorigin="anonymous"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        header { background-color: #1a1a1a; color: #fff; text-align: center; padding: 15px 0; border-bottom: 4px solid #d32f2f; }
        header h1 { margin: 0; font-size: 28px; font-weight: bold; }
        
        .main-container { max-width: 900px; margin: 40px auto; padding: 0 15px; }
        
        .top-section { display: flex; gap: 25px; align-items: flex-start; justify-content: center; }
        .news-section { flex: 1; max-width: 500px; }
        .news-section h2 { margin-top: 0; border-right: 4px solid #d32f2f; padding-right: 10px; font-size: 20px; color: #1a1a1a; margin-bottom: 20px; }
        
        .ad-card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); text-align: center; border: 2px solid #d32f2f; cursor: default; }
        .ad-desc { font-size: 14px; color: #444; line-height: 1.6; margin-bottom: 15px; }
        .ad-credits { background: #fdf2f2; border-radius: 6px; padding: 12px; font-size: 13px; border: 1px dashed #f5c6c6; text-align: right; color: #333; line-height: 1.6; }

        .about-box { width: 280px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 4px solid #d32f2f; border: 1px solid #eee; }

        footer { background: #1a1a1a; color: #ccc; text-align: center; padding: 15px; margin-top: 60px; font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <h1>SSC</h1>
    </header>

    <div class="main-container">
        
        <div class="top-section">
            
            <div class="news-section">
                <h2>أحدث النشرات والجرائد</h2>
                
                <div class="ad-card">
                    <div class="ad-desc">متابعة شاملة وأحدث التغطيات والتطورات لحظة بلحظة عبر SSC.</div>
                    <div class="ad-credits">
                        📌 <b>فكرة:</b> محمد أحمد البشرى<br>
                        🛠️ <b>إعداد:</b> أبو القاسم محمد أحمد البشرى
                    </div>
                </div>
            </div>

            <div class="about-box">
                <h3 style="margin-top:0; font-size:16px;">عن الموقع</h3>
                <p style="font-size:13px; color:#555; line-height:1.6;">موقع SSC الرسمي لنشر أحدث المقالات والتقارير الحصرية.</p>
            </div>

        </div>

    </div>

    <footer>
        جميع الحقوق محفوظة © 2026 - SSC
    </footer>

</body>
</html>
