<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جريدة SSC</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: #f4f4f9; color: #333; }
        
        /* هيدر بسيط يعرض اسم الجريدة فقط */
        header { 
            background-color: #1a1a1a; 
            color: #fff; 
            padding: 20px 5%; 
            text-align: center;
            border-bottom: 4px solid #e63946; 
        }
        .logo h1 { font-size: 32px; font-weight: 900; color: #fff; }
        .logo span { color: #e63946; }

        .container { 
            display: grid; 
            grid-template-columns: 3fr 1fr; 
            gap: 20px; 
            padding: 30px 5%; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .section-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            border-right: 4px solid #e63946;
            padding-right: 10px;
        }

        /* شبكة الأخبار الجديد */
        .news-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
        }
        .news-card { 
            background: #fff; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            transition: transform 0.2s; 
        }
        .news-card:hover { transform: translateY(-5px); }
        .news-card img { width: 100%; height: 180px; object-fit: cover; }
        .news-content { padding: 15px; }
        .news-title { font-size: 18px; margin: 10px 0; color: #1a1a1a; }
        .news-meta { font-size: 12px; color: #777; }

        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .ad-space { 
            background-color: #e9ecef; 
            border: 2px dashed #ccc; 
            text-align: center; 
            padding: 40px 10px; 
            color: #888; 
            font-weight: bold; 
            border-radius: 8px; 
        }
        .widget { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        footer { background: #1a1a1a; color: #fff; text-align: center; padding: 20px; margin-top: 40px; }

        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- اسم الموقع فقط -->
    <header>
        <div class="logo"><h1>جريدة <span>SSC</span></h1></div>
    </header>

    <!-- المساحة الرئيسية للـ الأخبار والجديد -->
    <div class="container">
        <main>
            <h2 class="section-title">أحدث النشرات والجرائد</h2>
            <div class="news-grid">
                
                <!-- خبر جديد 1 -->
                <article class="news-card">
                    <img src="https://via.placeholder.com/400x250" alt="صورة الخبر">
                    <div class="news-content">
                        <h2 class="news-title">عنوان الجريدة أو المنشور الجديد هنا</h2>
                        <p class="news-meta">تم النشر الآن</p>
                    </div>
                </article>

                <!-- خبر جديد 2 -->
                <article class="news-card">
                    <img src="https://via.placeholder.com/400x250" alt="صورة الخبر">
                    <div class="news-content">
                        <h2 class="news-title">منشور حديث أضيف مؤخراً للموقع</h2>
                        <p class="news-meta">منذ 30 دقيقة</p>
                    </div>
                </article>

            </div>
        </main>

        <!-- الشريط الجانبي للإعلانات والمعلومات -->
        <aside class="sidebar">
            <div class="ad-space">مساحة إعلانية (300x250)</div>
            <div class="widget">
                <h3 style="border-bottom: 2px solid #e63946; padding-bottom: 5px; margin-bottom: 10px;">عن الموقع</h3>
                <p>جريدة SSC الرسمية لنشر أحدث المقالات والتقارير الحصرية.</p>
            </div>
        </aside>
    </div>

    <footer><p>جميع الحقوق محفوظة &copy; 2026 - جريدة SSC</p></footer>
</body>
</html>
