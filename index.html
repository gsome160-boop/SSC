<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جريدة SSC</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        header { background-color: #1a1a1a; color: #fff; text-align: center; padding: 15px 0; border-bottom: 4px solid #d32f2f; }
        header h1 { margin: 0; font-size: 28px; font-weight: bold; }
        a { text-decoration: none; color: inherit; }
        
        .main-container { display: flex; max-width: 1250px; margin: 20px auto; gap: 15px; padding: 0 10px; justify-content: center; align-items: flex-start; }
        
        /* المساحات الإعلانية الجانبية النظيفة */
        .ad-banner { width: 180px; min-height: 500px; background-color: #eaeaea; border: 2px dashed #bbb; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #777; font-size: 13px; text-align: center; }

        /* المحتوى الأوسط */
        .content-area { flex: 1; max-width: 850px; }
        .top-section { display: flex; gap: 15px; }
        
        /* قسم الأخبار */
        .news-section { width: 70%; }
        .news-section h2 { margin-top: 0; border-right: 4px solid #d32f2f; padding-right: 10px; font-size: 20px; color: #1a1a1a; }
        .news-grid { display: flex; gap: 15px; }
        
        .news-card { flex: 1; background: #fff; padding: 12px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; transition: 0.2s; cursor: pointer; border: 1px solid #eee; }
        .news-card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .news-card h4 { font-size: 14px; margin: 10px 0 5px; color: #1a1a1a; }
        
        /* قسم عن الموقع */
        .about-box { width: 30%; background: #fff; padding: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 3px solid #d32f2f; height: fit-content; border: 1px solid #eee; }
        .about-box h3 { margin-top: 0; color: #1a1a1a; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .about-box p { font-size: 13px; color: #555; line-height: 1.6; }

        footer { background: #1a1a1a; color: #ccc; text-align: center; padding: 15px; margin-top: 40px; font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <h1>جريدة SSC</h1>
    </header>

    <div class="main-container">
        
        <!-- إعلان جهة اليمين -->
        <div class="ad-banner">
            <!-- ضَع كود الإعلان الحقيقي هنا -->
            مساحة إعلانية
        </div>

        <!-- المحتوى الأوسط -->
        <div class="content-area">
            <div class="top-section">
                
                <!-- قسم أحدث المنشورات -->
                <div class="news-section">
                    <h2>أحدث النشرات والجرائد</h2>
                    <div class="news-grid">
                        
                        <a href="post.html?title=موقع SSC الإخباري ينطلق رسمياً&content=أهلاً بكم في موقع SSC، المنصة المخصصة لنشر أحدث الأخبار والتغطيات الحصرية." class="news-card">
                            <div style="background:#e0e0e0; height:90px; display:flex; align-items:center; justify-content:center; color:#666; font-size:12px; border-radius:4px;">صورة الخبر</div>
                            <h4>عنوان الجريدة أو المنشور الجديد هنا</h4>
                            <span style="font-size:11px; color:#888;">تم النشر الآن</span>
                        </a>

                        <a href="post.html?title=منشور حديث أضيف مؤخراً للموقع&content=هذا نص خبر تجريبي جديد يمكنك التعديل عليه في أي وقت." class="news-card">
                            <div style="background:#e0e0e0; height:90px; display:flex; align-items:center; justify-content:center; color:#666; font-size:12px; border-radius:4px;">صورة الخبر</div>
                            <h4>منشور حديث أضيف مؤخراً للموقع</h4>
                            <span style="font-size:11px; color:#888;">منذ 30 دقيقة</span>
                        </a>

                    </div>
                </div>

                <!-- قسم عن الموقع -->
                <div class="about-box">
                    <h3>عن الموقع</h3>
                    <p>جريدة SSC الرسمية لنشر أحدث المقالات والتقارير الحصرية.</p>
                </div>

            </div>
        </div>

        <!-- إعلان جهة اليسار -->
        <div class="ad-banner">
            <!-- ضَع كود الإعلان الحقيقي هنا -->
            مساحة إعلانية
        </div>

    </div>

    <footer>
        جميع الحقوق محفوظة © 2026 - جريدة SSC
    </footer>

</body>
</html>
