<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC - تفاصيل الخبر</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        header { background-color: #1a1a1a; color: #fff; text-align: center; padding: 15px 0; border-bottom: 4px solid #d32f2f; }
        header h1 { margin: 0; font-size: 28px; font-weight: bold; }
        a { text-decoration: none; color: inherit; }
        .container { max-width: 800px; margin: 40px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h2 { color: #d32f2f; border-right: 4px solid #d32f2f; padding-right: 10px; margin-top: 0; }
        p { font-size: 16px; color: #444; line-height: 1.8; }
        .back-btn { display: inline-block; margin-top: 20px; background: #1a1a1a; color: #fff; padding: 8px 15px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1><a href="index.html">SSC</a></h1>
    </header>

    <div class="container">
        <h2 id="news-title">🇸🇩 نبض السودان</h2>
        <p id="news-content">مرحباً بكم في قسم نبض السودان عبر موقع SSC. نقدم لكم متابعة شاملة وأحدث التغطيات والتطورات لحظة بلحظة.</p>
        <a href="index.html" class="back-btn">← العودة للرئيسية</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const title = urlParams.get('title');
        const content = urlParams.get('content');

        if (title) document.getElementById('news-title').innerText = title;
        if (content) document.getElementById('news-content').innerText = content;
    </script>

</body>
</html>
