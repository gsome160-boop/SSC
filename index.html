<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        header { background-color: #1a1a1a; color: #fff; text-align: center; padding: 15px 0; border-bottom: 4px solid #d32f2f; }
        header h1 { margin: 0; font-size: 28px; }
        
        /* تخطيط الصفحة الرئيسي */
        .main-container { display: flex; max-width: 1200px; margin: 20px auto; gap: 15px; padding: 0 10px; }
        
        /* المساحات الإعلانية الجانبية */
        .ad-banner { width: 180px; min-height: 400px; background-color: #e0e0e0; border: 2px dashed #bbb; display: flex; align-items: center; justify-content: center; color: #666; font-size: 14px; text-align: center; }
        
        /* المحتوى الأوسط */
        .content-area { flex: 1; }
        
        /* قسم عن الموقع والأخبار */
        .top-section { display: flex; gap: 15px; margin-bottom: 20px; }
        .about-box { width: 30%; background: #fff; padding: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 3px solid #d32f2f; }
        .about-box h3 { margin-top: 0; color: #1a1a1a; }
        
        .news-section { width: 70%; }
        .news-section h2 { margin-top: 0; border-right: 4px solid #d32f2f; padding-right: 10px; font-size: 20px; }
        .news-grid { display: flex; gap: 15px; }
        .news-card { flex: 1; background: #fff; padding: 12px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .news-card img { width: 100%; height: 120px; object-fit: cover; background: #eee; border-radius: 4px; }
        
        footer { background: #1a1a1a; color: #ccc; text-align: center; padding: 15px; margin-top: 30px; font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <h1>SSC</h1>
    </header>

    <div class="main-container">
        <!-- إعلان جهة اليمين -->
        <div class="ad-banner">
            مساحة إعلانية
        </div>

        <!-- المحتوى الأوسط -->
        <div class="content-area">
            <div class="top-section">
                <!-- قسم عن الموقع في مكان الـ X -->
                <div class="about-box">
                    <h3>عن الموقع</h3>
                    <p>موقع SSC الرسمي لنشر أحدث المقالات والأخبار والتغطيات الحصرية.</p>
                </div>

                <!-- قسم أحدث المنشورات -->
                <div class="news-section">
                    <h2>أحدث النشرات والجرائد</h2>
                    <div class="news-grid">
                        <div class="news-card">
                            <div style="background:#eee; height:100px; display:flex; align-items:center; justify-content:center; color:#888;">صورة الخبر</div>
                            <h4>عنوان المنشور الجديد هنا</h4>
                            <span style="font-size:11px; color:#888;">تم النشر الآن</span>
                        </div>
                        <div class="news-card">
                            <div style="background:#eee; height:100px; display:flex; align-items:center; justify-content:center; color:#888;">صورة الخبر</div>
                            <h4>منشور حديث أضيف مؤخراً</h4>
                            <span style="font-size:11px; color:#888;">منذ 30 دقيقة</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- إعلان جهة اليسار -->
        <div class="ad-banner">
            مساحة إعلانية
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة © 2026 - SSC
    </footer>

</body>
</html>
